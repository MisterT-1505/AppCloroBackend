server:
  port: 6767

spring:
  application:
    name: ms-mediciones
  datasource:
    url: jdbc:h2:file:./data/mediciones;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.appcloro.mediciones: INFO
